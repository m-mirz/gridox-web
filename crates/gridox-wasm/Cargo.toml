[package]
name = "gridox-wasm"
description = "The libraries behind gridox-web, as WebAssembly: JSON in and out, no analysis of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cimmodel = { package = "cimoxide-model", version = "0.6.2" }
cimvalidation = { package = "cimoxide-validation", version = "0.6.2" }
cimview = { package = "cimoxide-view", version = "0.6.2" }
gridoxide = { version = "0.6.0", default-features = false, features = ["cgmes"] }
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
