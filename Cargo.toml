[workspace]
members = ["crates/gridox-wasm"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/m-mirz/gridox-web"

# Size over speed would cost the solvers, so this stays at -O3 until a measurement says
# otherwise. wasm-pack runs wasm-opt on top.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Curative actions (gridoxide PR #36) are merged but not released: main at the merge.
[patch.crates-io]
gridoxide = { git = "https://github.com/m-mirz/gridoxide", rev = "0b5bee4a56db8a9ca697ff82fde7a13eab14b8fd" }
