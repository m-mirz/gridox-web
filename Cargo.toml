[workspace]
members = ["crates/gridox-wasm"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/m-mirz/gridox-web"

# Size over speed would cost the solvers, so this stays at -O3 until a measurement says
# otherwise. wasm-pack runs wasm-opt on top.
[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# Until gridoxide releases solving from the switches (gridoxide PR #35): the local checkout.
[patch.crates-io]
gridoxide = { path = "../gridoxide" }
